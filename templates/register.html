
{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="card">
    <h2>Tạo tài khoản</h2>
    <form method="post">
        <label>Tên đăng nhập</label>
        <input name="username" maxlength="80" required
               autocomplete="username">

        <label>Email</label>
        <input type="email" name="email" maxlength="120" required
               autocomplete="email">

        <label>Mật khẩu (ít nhất 8 ký tự)</label>
        <input type="password" name="password" minlength="8" required
               autocomplete="new-password">

        <button type="submit">Đăng ký</button>
    </form>
    <p>Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a></p>
</div>
{% endblock %}
